# nginx for the static build (Docker image: see Dockerfile). Put TLS in front of it (Caddy,
# Traefik or a load balancer); this server speaks plain HTTP on port 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Redirects keep the host and scheme the client used (behind a TLS proxy).
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  gzip_types text/css application/javascript application/json application/manifest+json
    image/svg+xml text/plain application/xml;

  error_page 404 /404.html;

  # Content-hashed bundles never change.
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The service worker, manifest and pages must be revalidated so updates arrive.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # Directory URLs ("/faq/") serve their index.html; "/faq" redirects to "/faq/".
    try_files $uri $uri/ =404;
  }
}
