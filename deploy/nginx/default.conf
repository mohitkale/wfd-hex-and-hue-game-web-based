# nginx for the static build (Docker image: see Dockerfile). Put TLS in front of it (Caddy,
# Traefik or a load balancer); this server speaks plain HTTP on port 8080.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Redirects keep the host and scheme the client used (behind a TLS proxy).
  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 512;
  # Also behind proxies and CDNs (they add Via), with Vary so shared caches keep both versions.
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/manifest+json
    image/svg+xml text/plain text/xml application/xml;

  # 403: folders without an index page (/icons/, /art/…), answered like any missing page.
  error_page 403 404 /404.html;

  # Netlify's header file is copied into the build; nothing to serve here.
  location = /_headers {
    return 404;
  }

  # The v2 review board has a stable (unhashed) name so shipping it never changes the main bundle;
  # it is outside /_astro/ (immutable, precached) and always revalidated.
  location /v2/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  # Content-hashed bundles never change.
  location /_astro/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # The service worker, manifest and pages must be revalidated so updates arrive.
  location = /sw.js {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }
  location = /manifest.webmanifest {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
  }

  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    # Directory URLs ("/faq/") serve their index.html; "/faq" redirects to "/faq/".
    try_files $uri $uri/ =404;
  }
}
